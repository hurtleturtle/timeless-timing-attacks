[loggers]
keys=root

[handlers]
keys=consoleHandler

[formatters]
keys=standardFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=standardFormatter
args=(sys.stdout,)

[formatter_standardFormatter]
format=%(asctime)s.%(msecs)03d - %(name)-10s - %(filename)-8s (%(lineno)d) - %(levelname)-8s - %(funcName)s - %(message)s
datefmt=%H:%M:%S